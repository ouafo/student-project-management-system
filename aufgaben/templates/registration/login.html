{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">Boardify</div>
        <div class="auth-subtitle">Projektmanagement und Zusammenarbeit</div>

        <h1 class="auth-title">Login</h1>
        <p class="auth-desc">Melde dich an, um weiterzuarbeiten</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn-primary" type="submit">
                Einloggen
            </button>
        </form>
    </div>
</div>
{% endblock %}
