{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Aufgabe löschen</title>
    <link rel="stylesheet" href="{% static 'aufgaben/css/style.css' %}">
</head>
<body>
    <div class="box">
        <h1>Aufgabe löschen</h1>
        <p>Möchtest du die Aufgabe <strong>{{ aufgabe.titel }}</strong> wirklich löschen?</p>

        <form method="post" class="delete-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Ja, löschen</button>
            <a href="{% url 'aufgaben:aufgabe_detail' aufgabe.pk %}" class="btn btn-secondary">Abbrechen</a>
        </form>
    </div>
</body>
</html>
