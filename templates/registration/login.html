{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login | Boardify</title>
    <link rel="stylesheet" href="{% static 'Register.css' %}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <header class="auth-header">
            <h1 class="auth-title">Boardify</h1>
            <p class="auth-subtitle">Willkommen zurück</p>
        </header>

        {% if messages %}
        <div class="auth-messages">
            {% for message in messages %}
            <div class="auth-message">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% if form.errors %}
        <div class="form-error-box">
            <p>Benutzername oder Passwort ist falsch.</p>
        </div>
        {% endif %}

        <form class="auth-form" method="POST" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username"
                       placeholder="Dein Vorname (z.B. max)"
                       class="auth-input"
                       autofocus required>
            </div>

            <div class="form-group">
                <label>Passwort</label>
                <input type="password" name="password"
                       placeholder="••••••••"
                       class="auth-input" required>
                <a href="{% url 'password_reset' %}" class="forgot-link">
                    Passwort vergessen?
                </a>
            </div>

            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-primary">Anmelden</button>
        </form>

        <p class="auth-footer-text">
            Noch kein Konto?
            <a href="{% url 'register' %}" class="auth-link">Jetzt registrieren</a>
        </p>
    </section>
</main>
</body>
</html>
