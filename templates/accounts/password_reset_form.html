{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort zurücksetzen | Boardify</title>
    <link rel="stylesheet" href="{% static 'Register.css' %}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <header class="auth-header">
            <h1 class="auth-title">Boardify</h1>
            <p class="auth-subtitle">Passwort zurücksetzen</p>
        </header>
        <form class="auth-form" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>E-Mail Adresse</label>
                <input type="email" name="email"
                       placeholder="deine@email.de"
                       class="auth-input" required>
                <span class="field-hint">Wir senden dir einen Link zum Zurücksetzen</span>
            </div>
            <button type="submit" class="btn-primary">Link senden</button>
        </form>
        <p class="auth-footer-text">
            <a href="{% url 'login' %}" class="auth-link">← Zurück zum Login</a>
        </p>
    </section>
</main>
</body>
</html>
