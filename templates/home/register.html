<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrierung | Boardify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Django-Version -->

 <link rel="stylesheet" type="text/css" href="../static/Register.css">
    <!-- Falls du ohne Django testest:
    <link rel="stylesheet" href="style.css">
    -->
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="register-title">
            <header class="auth-header">
                <h1 id="register-title" class="auth-title">Boardify</h1>
                <p class="auth-subtitle">Dein Projektmanagement‑Tool für Studierende</p>
            </header>

            <form class="auth-form" method="post" novalidate>

                <div class="form-group">
              {{ form.username.label_tag }}
              {{ form.username }}
                </div>

               <div class="form-group">
             {{ form.email.label_tag }}
             {{ form.email }}
              </div>

               <div class="form-group">
             {{ form.password1.label_tag }}
             {{ form.password1 }}
               </div>

              <div class="form-group">
             {{ form.password2.label_tag }}
             {{ form.password2 }}
             </div>
                <button type="submit" class="btn-primary">
                    Registrieren
                </button>
            </form>

            <p class="auth-footer-text">
                Hast du schon ein Konto?
                <a href="/templates/home/einloggen.html" class="auth-link">Jetzt anmelden</a>
                <!-- Ohne Django: <a href="login.html" class="auth-link">Jetzt anmelden</a> -->
            </p>
        </section>
    </main>
</body>
</html>
