<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login | Boardify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Django-Version -->
    <link rel="stylesheet" type="text/css" href="../static/Register.css">

    <!-- Ohne Django:
    <link rel="stylesheet" href="style.css">
    -->
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="login-title">
            <header class="auth-header">
                <h1 id="login-title" class="auth-title">Boardify</h1>
                <p class="auth-subtitle">Willkommen zurück</p>
            </header>

            <form class="auth-form" method="post" novalidate>

                <div class="form-group">
                    <label for="id_email">E‑Mail</label>
                    <input
                        type="email"
                        id="id_email"
                        name="email"
                        placeholder="deine@email.de"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="id_password">Passwort</label>
                    <input
                        type="password"
                        id="id_password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">
                   <a href="startseite.html"> Anmelden </a>
                </button>
            </form>

            <p class="auth-footer-text">
                Noch kein Konto?
                <a href="registrierung.html" class="auth-link">Jetzt registrieren</a>
                <!-- Ohne Django: <a href="register.html" class="auth-link">Jetzt registrieren</a> -->
            </p>
        </section>
    </main>
</body>
</html>
