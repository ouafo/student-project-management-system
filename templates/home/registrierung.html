<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrierung | Boardify</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Django-Version -->

 <link rel="stylesheet" type="text/css" href="../static/Register.css">
    <!-- Falls du ohne Django testest:
    <link rel="stylesheet" href="style.css">
    -->
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="register-title">
            <header class="auth-header">
                <h1 id="register-title" class="auth-title">Boardify</h1>
                <p class="auth-subtitle">Dein Projektmanagement‑Tool für Studierende</p>
            </header>

            <form class="auth-form" method="post" novalidate>

                <div class="form-group">
                    <label for="id_name">Name</label>
                    <input
                        type="text"
                        id="id_name"
                        name="name"
                        placeholder="Max Mustermann"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="id_email">E‑Mail</label>
                    <input
                        type="email"
                        id="id_email"
                        name="email"
                        placeholder="deine@email.de"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="id_password">Passwort</label>
                    <input
                        type="password"
                        id="id_password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="id_password2">Passwort bestätigen</label>
                    <input
                        type="password"
                        id="id_password2"
                        name="password_confirm"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">
                    Registrieren
                </button>
            </form>

            <p class="auth-footer-text">
                Hast du schon ein Konto?
                <a href="einloggen.html" class="auth-link">Jetzt anmelden</a>
                <!-- Ohne Django: <a href="login.html" class="auth-link">Jetzt anmelden</a> -->
            </p>
        </section>
    </main>
</body>
</html>
